[package]
name = "diagram"
version = "0.1.2"
edition = "2024"
description = "Native Rust diagram platform: render, generate, analyze, and interchange (Mermaid/PlantUML compatible)"
authors = ["Ying Kit WONG"]
license = "Apache-2.0"
repository = "https://github.com/yingkitw/diagram"
readme = "README.md"

[dependencies]
rmcp = { version = "2", features = ["server", "transport-io", "macros"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
schemars = "1"
notify = "7"
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"
printpdf = "0.7"
