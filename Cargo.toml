[package]
name = "diagram"
version = "0.1.5"
edition = "2024"
description = "Rust CLI & MCP server for diagram rendering, generation, and analysis — Mermaid, PlantUML, Graphviz DOT, D2, JSON IR → SVG/PNG/PDF without Chromium or Java"
authors = ["Ying Kit WONG"]
license = "Apache-2.0"
repository = "https://github.com/yingkitw/diagram"
homepage = "https://github.com/yingkitw/diagram"
documentation = "https://github.com/yingkitw/diagram#readme"
readme = "README.md"
default-run = "diagram"
keywords = ["diagram", "mermaid", "plantuml", "svg", "mcp"]
categories = ["command-line-utilities", "development-tools", "visualization", "parsing", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "diagram"
path = "src/main.rs"
required-features = ["native"]

[[bin]]
name = "diagram-gui"
path = "src/bin/diagram-gui.rs"
required-features = ["gui"]

[features]
default = ["native"]
# CLI, MCP, preview server, PNG/PDF (filesystem + tokio)
native = [
    "dep:clap",
    "dep:rmcp",
    "dep:tokio",
    "dep:anyhow",
    "dep:schemars",
    "dep:notify",
    "dep:resvg",
    "dep:usvg",
    "dep:tiny-skia",
    "dep:svg2pdf",
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
]
# Browser embed (wasm-bindgen); build with --no-default-features --features wasm
wasm = ["dep:wasm-bindgen", "dep:console_error_panic_hook"]
# Desktop GUI (egui/eframe); build with --features gui. Fully offline / local-first.
gui = ["native", "dep:eframe", "dep:egui", "dep:rfd"]
eframe = ["dep:eframe"]
rfd = ["dep:rfd"]
egui = ["dep:egui"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"], optional = true }
rmcp = { version = "2", features = ["server", "transport-io", "macros"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
anyhow = { version = "1", optional = true }
schemars = { version = "1", optional = true }
notify = { version = "7", optional = true }
resvg = { version = "0.45", optional = true }
usvg = { version = "0.45", optional = true }
tiny-skia = { version = "0.11", optional = true }
svg2pdf = { version = "0.13", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
tree-sitter = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"], optional = true }
rfd = { version = "0.17.2", optional = true }
egui = { version = "0.37.0", optional = true }
